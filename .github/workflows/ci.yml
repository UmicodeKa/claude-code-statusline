name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'
      # ShellCheck は版によって指摘が変わるため、apt (Ubuntu 24.04 は 0.9.0) ではなくリリースのバイナリを
      # sha256 で検証して入れ、版を固定する。版を上げるときは docs/DEVELOPMENT.md の最低版もそろえる。
      - name: Install ShellCheck
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          archive="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${archive}"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          sudo install -m 755 "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
      - run: npm ci
      - run: npm run check:ci

  test:
    # Linux 版は GNU coreutils 前提で手元の macOS では検証できないため、ubuntu runner で回す。
    # macOS 版は BSD 系コマンド前提で Linux では動かず (ハーネスが skip する)、手元の npm test で担保する。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - run: sudo apt-get update && sudo apt-get install -y jq
      - run: npm ci
      # Linux 版を実行できない環境なら skip せずに落とす (全件 skip のまま green になるのを防ぐ)。
      - run: npm test
        env:
          STATUSLINE_TEST_REQUIRE_DEBIAN: '1'
