name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  test:
    # macOS 版は BSD 系コマンド前提のため macOS runner で回す。
    # Debian 版は GNU coreutils 前提で macOS runner では動かないため、bash 4.1+ / flock を入れずに skip させる。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - run: brew install jq
      - run: npm ci
      - run: npm test
