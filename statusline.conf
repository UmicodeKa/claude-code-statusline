# statusline の設定ファイル。~/.claude/statusline.conf に置くと読み込まれる。
# 全項目をデフォルト値で記載している (HIGHLIGHT だけはおすすめの設定 branch|pr_number)。変えたい行だけ値を書き換える (不要な行は消してよい)。
# Settings file for the statusline. Place it at ~/.claude/statusline.conf to have it loaded.
# Every option is listed with its default value (except HIGHLIGHT, which is set to the recommended branch|pr_number). Edit only the lines you want to change (you may delete the rest).
#
# このファイルはシェルスクリプトとして読み込まれる (`.` で source)。
# 変数代入以外を書かないこと (コマンドは描画のたびに実行され、出力は statusline に混ざる)。
# This file is sourced as a shell script (`.`).
# Write only variable assignments (commands run on every render and their output is mixed into the statusline).
#
# 環境変数 CLAUDE_STATUSLINE_<名前> が設定されている場合は、そちらが優先される。
# If the environment variable CLAUDE_STATUSLINE_<NAME> is set, it takes precedence.

# モデル名の表示。1=表示 (✻ <model>∙<effort>)、0=非表示 (✻ <effort>)
# Show the model name. 1=show (✻ <model>∙<effort>), 0=hide (✻ <effort>)
SHOW_MODEL_NAME=1

# カラースキーム。dark / light
# Color scheme: dark / light
COLOR_SCHEME=dark

# バックグラウンド git fetch で ↓behind を自動最新化する。0=無効、1=有効
# Refresh ↓behind with a background git fetch. 0=off, 1=on
GIT_FETCH=0

# ブランチ列の末尾 (ab の右) に現在のブランチの GitHub の PR の状態を表示する。0=無効、1=有効
# (gh のインストールと gh auth login が必要)
# Show the GitHub PR status of the current branch at the end of the branch column (right of ab). 0=off, 1=on
# (requires gh to be installed and `gh auth login`)
PR_STATUS=0

# 1 行目のディレクトリ名の表示。1=表示、0=非表示
# Show the directory name on line 1. 1=show, 0=hide
SHOW_CWD=1

# 表示要素の並び。トークンを | で区切って並べる (| を含むためクォート必須)
# 1 行目: directory / branch (PR_STATUS=1 なら PR の状態も) / commit / session。書かなかったトークンは出ない (none で 1 行目ごと消す)
# 2 行目: model_ctx / rate / weekly。並び順だけ変えられる (書かなかったトークンは末尾に補われる)
# Order of the elements. Separate tokens with | (quotes are required because of the |).
# Line 1: directory / branch (with the PR status if PR_STATUS=1) / commit / session. Tokens you omit are not shown (none removes line 1 entirely).
# Line 2: model_ctx / rate / weekly. Only the order can be changed (omitted tokens are appended at the end).
LAYOUT_LINE1="directory|branch|commit|session"
LAYOUT_LINE2="model_ctx|rate|weekly"

# 無色の要素のうち、目立たせるものを文字色 (dark は白、light は黒) で塗る。トークンを | で区切って並べる (| を含むためクォート必須)
# directory / branch (最後の / より後ろ) / commit (コミットハッシュ) / session / model / ctx_chart / rate_chart / rate_reset /
# weekly_chart / weekly_reset / pr_comments / pr_number (レビュー待ちの PR 番号)。色が付いている状態 (警戒域、Opus などのモデル色、approved などの PR 番号) ではその色を優先する
# 例: HIGHLIGHT="directory|branch|session"。どれも塗らないときは HIGHLIGHT="none"
# Emphasize uncolored elements with the text color (white on dark, black on light). Separate tokens with | (quotes are required because of the |).
# Tokens: directory / branch (the part after the last /) / commit (commit hash) / session / model / ctx_chart / rate_chart / rate_reset /
# weekly_chart / weekly_reset / pr_comments / pr_number (PR number awaiting review). An element that already has a color (warning levels, model colors such as Opus, PR numbers such as approved) keeps that color.
# Example: HIGHLIGHT="directory|branch|session". To emphasize nothing, use HIGHLIGHT="none"
HIGHLIGHT="branch|pr_number"

# レートリミットのチャートの文字数。右端 1 文字が現在値、左が履歴の遷移。範囲 2〜20 (範囲外は丸められる)
# Number of characters in the rate limit chart. The rightmost character is the current value; the rest show the history. Range 2-20 (out-of-range values are clamped).
RATE_CHART_LEN=12

# レートリミット履歴のサンプリング間隔 (秒)。範囲 60〜(18000 ÷ RATE_CHART_LEN) (範囲外は丸められる)
# 既定のチャート長 (12) では 60〜1500。既定値では、描画が続いていれば約 1 時間分 (5 分 × 12 文字) の推移を表示する
# Sampling interval of the rate limit history, in seconds. Range 60-(18000 / RATE_CHART_LEN) (out-of-range values are clamped).
# With the default chart length (12) that is 60-1500. With the defaults, about one hour of history (5 min x 12 chars) is shown as long as rendering continues.
POLL_INTERVAL_SEC=300

# バックグラウンド git fetch の最小間隔 (秒)。範囲 60〜1800 (範囲外は丸められる)
# Minimum interval between background git fetches, in seconds. Range 60-1800 (out-of-range values are clamped).
GIT_FETCH_INTERVAL_SEC=900
